syntax = "proto3";

package game;
option go_package = "game_backend/proto/game";

message PlayerInfo {
    int64 user_id = 1;
    string username = 2;
    int32 level = 3;
    int64 exp = 4;
    int64 gold = 5;
    int64 diamond = 6;
}

message LoginRequest {
    string username = 1;
    string password = 2;
}

message LoginResponse {
    int32 code = 1;
    string message = 2;
    string token = 3;
    PlayerInfo player = 4;
}

message RegisterRequest {
    string username = 1;
    string password = 2;
    string email = 3;
}

message RegisterResponse {
    int32 code = 1;
    string message = 2;
    int64 user_id = 3;
}

message GetPlayerInfoRequest {
    string token = 1;
}

message GetPlayerInfoResponse {
    int32 code = 1;
    string message = 2;
    PlayerInfo player = 3;
}

message UpdatePlayerInfoRequest {
    string token = 1;
    string username = 2;
}

message UpdatePlayerInfoResponse {
    int32 code = 1;
    string message = 2;
}

service PlayerService {
    rpc Login(LoginRequest) returns (LoginResponse);
    rpc Register(RegisterRequest) returns (RegisterResponse);
    rpc GetPlayerInfo(GetPlayerInfoRequest) returns (GetPlayerInfoResponse);
    rpc UpdatePlayerInfo(UpdatePlayerInfoRequest) returns (UpdatePlayerInfoResponse);
}
